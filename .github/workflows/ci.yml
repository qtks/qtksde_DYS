name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CI: true
  # AppImage tooling has no FUSE on runners; extract before running.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  # Fast gate on every push and PR. Deliberately Ubuntu-only so pull
  # requests never spend macOS minutes.
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Packaging only for main, tags and manual runs. Pull requests stop at the
  # check job above.
  build:
    name: bundle ${{ matrix.name }}
    needs: check
    if: >-
      ${{ github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, bundles: "deb,rpm,appimage" }
          - { name: windows-x64, os: windows-latest, bundles: "nsis,msi" }
          - { name: macos-arm64, os: macos-14, bundles: "app,dmg" }
          - { name: macos-x64, os: macos-15-intel, bundles: "app,dmg" }
    env:
      # Signing is opt-in: every value below may be empty, and empty means the
      # build still succeeds with unsigned installers. See docs/release.md.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # createUpdaterArtifacts requires plugins.updater.pubkey; both must be
      # present or the updater signature step is skipped.
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
          # Needed by AppImage tooling; the t64 name exists on 24.04+.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $path = Join-Path $env:RUNNER_TEMP "panopticon.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item $path -Force

      - name: Build bundles
        shell: bash
        run: |
          # GitHub runs bash with -e; diagnostics must not abort the build.
          set +e
          echo "runner=$(uname -a)"
          node --version || true
          npm --version || true
          cargo --version || true
          ./ui/node_modules/.bin/tauri --version || true
          log="$(mktemp)"
          args=(build --bundles "${{ matrix.bundles }}" --verbose)
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -n "${TAURI_UPDATER_PUBKEY:-}" ]; then
            echo "::notice::updater signing enabled"
            args+=(--config "{\"plugins\":{\"updater\":{\"pubkey\":\"${TAURI_UPDATER_PUBKEY}\"}},\"bundle\":{\"createUpdaterArtifacts\":true}}")
          elif [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY set without TAURI_UPDATER_PUBKEY - skipping updater signatures"
          else
            echo "::notice::no TAURI_SIGNING_PRIVATE_KEY - building unsigned installers"
          fi
          if [ -n "${WINDOWS_CERT_THUMBPRINT:-}" ]; then
            args+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"${WINDOWS_CERT_THUMBPRINT}\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi
          ./ui/node_modules/.bin/tauri "${args[@]}" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Annotations are readable without repo credentials, unlike the
            # Actions log download API.
            echo "::error::bundling failed with exit code $status"
            tail -n 30 "$log" | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: panopticon-${{ matrix.name }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 14

  # Tag-only: attach every installer to a draft-free GitHub Release.
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f -printf '%p %s bytes\n' | sort

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sig
