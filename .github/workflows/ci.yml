name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CI: true
  # AppImage tooling has no FUSE on runners; extract before running.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  # Fast gate on every push and PR. Deliberately Ubuntu-only so pull
  # requests never spend macOS minutes.
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Packaging only for main, tags and manual runs. Pull requests stop at the
  # check job above.
  build:
    name: bundle ${{ matrix.name }}
    needs: check
    if: >-
      ${{ github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35), not latest: runners built on 24.04 put
          # GLIBC_2.39 symbols in the binary, which fails to load on Debian 12
          # and Ubuntu 22.04 LTS.
          - {
              name: linux-x64,
              os: ubuntu-22.04,
              bundles: "deb,rpm,appimage",
              target: x86_64-unknown-linux-gnu,
            }
          - {
              name: windows-x64,
              os: windows-latest,
              bundles: "nsis,msi",
              target: x86_64-pc-windows-msvc,
            }
          - {
              name: macos-arm64,
              os: macos-15,
              bundles: "app,dmg",
              target: aarch64-apple-darwin,
            }
          - {
              name: macos-x64,
              os: macos-15-intel,
              bundles: "app,dmg",
              target: x86_64-apple-darwin,
            }
    env:
      # Signing is opt-in: every value below may be empty, and empty means the
      # build still succeeds with unsigned installers. See docs/release.md.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # createUpdaterArtifacts requires plugins.updater.pubkey; both must be
      # present or the updater signature step is skipped.
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          # The runner image ships most of these; install only what is missing.
          # A bare `apt-get update` can hang on a slow mirror, so it gets a hard
          # timeout and the pre-populated package lists are used as a fallback.
          pkgs="libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf"
          missing=""
          for p in $pkgs; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "all system dependencies already installed"
            exit 0
          fi
          echo "installing:$missing"
          sudo apt-get update -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 || true
          sudo apt-get install -y --no-install-recommends $missing

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build walker-index sidecar
        shell: bash
        run: |
          # Tauri resolves externalBin entries as <name>-<target-triple>, so the
          # scanner must be built for this matrix target and copied verbatim.
          # Without it the installed app shows an empty state that tells users
          # to run a command the package does not contain.
          target="${{ matrix.target }}"
          rustup target add "$target"
          cargo build -p walker-index --release --target "$target"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p src-tauri/binaries
          cp "target/$target/release/walker-index$exe" \
             "src-tauri/binaries/walker-index-$target$exe"
          ls -l src-tauri/binaries

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $path = Join-Path $env:RUNNER_TEMP "panopticon.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item $path -Force

      - name: Build bundles
        shell: bash
        run: |
          # GitHub runs bash with -e; diagnostics must not abort the build.
          set +e
          log="${RUNNER_TEMP:-/tmp}/build.log"
          status=0
          # Annotations are readable without repo credentials, unlike the
          # Actions log download API. GitHub keeps only ten annotations per
          # step, so the whole excerpt goes into a single message.
          report_failure() {
            echo "::error::$1 failed with exit code $status"
            tr '\r' '\n' < "$log" > "$log.clean"
            {
              grep -a -i -E "error|failed|failure|panicked|denied|no space|codesign|hdiutil|not found" "$log.clean" \
                | grep -a -v -E "^ *Compiling |^ *Downloading " | tail -n 15
              echo "-------- tail --------"
              tail -n 50 "$log.clean"
            } > "$log.diag"
            echo "::error::$(tr '\n' '|' < "$log.diag" | cut -c1-3500)"
          }
          echo "runner=$(uname -a)"
          df -h . | tail -n 1 || true
          node --version || true
          npm --version || true
          cargo --version || true
          ./ui/node_modules/.bin/tauri --version || true

          # Missing secrets arrive as empty strings, and Tauri treats an empty
          # APPLE_CERTIFICATE as "sign here", which fails on a blank .p12.
          # Remove empty values so unsigned builds really skip signing.
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                   TAURI_UPDATER_PUBKEY WINDOWS_CERTIFICATE_BASE64 \
                   WINDOWS_CERTIFICATE_PASSWORD APPLE_CERTIFICATE \
                   APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then
              unset "$v"
            fi
          done

          args=(build)
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -n "${TAURI_UPDATER_PUBKEY:-}" ]; then
            echo "::notice::updater signing enabled"
            args+=(--config "{\"plugins\":{\"updater\":{\"pubkey\":\"${TAURI_UPDATER_PUBKEY}\"}},\"bundle\":{\"createUpdaterArtifacts\":true}}")
          elif [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY set without TAURI_UPDATER_PUBKEY - skipping updater signatures"
          else
            echo "::notice::no TAURI_SIGNING_PRIVATE_KEY - building unsigned installers"
          fi
          if [ -n "${WINDOWS_CERT_THUMBPRINT:-}" ]; then
            args+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"${WINDOWS_CERT_THUMBPRINT}\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi

          # Split compile from bundling so a killed compiler is distinguishable
          # from a failing installer step.
          ./ui/node_modules/.bin/tauri "${args[@]}" --no-bundle --verbose 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            report_failure compile
            exit "$status"
          fi

          ./ui/node_modules/.bin/tauri "${args[@]}" --bundles "${{ matrix.bundles }}" --verbose 2>&1 | tee -a "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            report_failure bundle
            exit "$status"
          fi

      - name: List bundles
        shell: bash
        run: |
          dir=src-tauri/target/release/bundle
          if [ ! -d "$dir" ]; then
            echo "::error::$dir missing"
            exit 1
          fi
          listing="$(find "$dir" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.sig' \) | while IFS= read -r f; do
            printf '%s=%s bytes, ' "${f#"$dir"/}" "$(wc -c < "$f" | tr -d ' ')"
          done)"
          echo "::notice::bundles: $listing"

          # Each platform must produce at least one installer of the expected
          # kind; this is the check that proves the bundler really ran.
          case "${{ matrix.name }}" in
            linux-x64) want='*.deb' ;;
            windows-x64) want='*.msi' ;;
            macos-*) want='*.dmg' ;;
            *) want='' ;;
          esac
          if [ -n "$want" ]; then
            count="$(find "$dir" -type f -name "$want" | wc -l | tr -d ' ')"
            echo "::notice::${{ matrix.name }} $want files: $count"
            if [ "$count" -eq 0 ]; then
              echo "::error::${{ matrix.name }} produced no $want"
              exit 1
            fi
          fi
          if [ "${{ matrix.name }}" = "linux-x64" ]; then
            count="$(find "$dir" -type f -name '*.AppImage' | wc -l | tr -d ' ')"
            echo "::notice::AppImage files: $count"
            if [ "$count" -eq 0 ]; then
              echo "::error::the appimage bundler produced no .AppImage file"
              exit 1
            fi
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: ${{ runner.temp }}/*.log*
          if-no-files-found: warn

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: panopticon-${{ matrix.name }}
          # Keep installers only: the deb staging directory holds control.tar.gz
          # and data.tar.gz, and the AppImage AppDir is already inside the
          # .AppImage. Both used to leak into the Release page.
          path: |
            src-tauri/target/release/bundle
            !src-tauri/target/release/bundle/appimage/Panopticon.AppDir/**
            !src-tauri/target/release/bundle/deb/*/control.tar.gz
            !src-tauri/target/release/bundle/deb/*/data.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Tag-only: attach every installer to a draft-free GitHub Release.
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f -printf '%p %s bytes\n' | sort

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 安装说明 / Installation

            **本页所有安装包均未签名、未公证（unsigned, not notarized）。**
            macOS 与 Windows 会因此显示安全警告；这是未签名构建的预期行为，
            不代表安装包损坏。每个包都附有 SHA-256 校验值可供核对。

            ### macOS（Gatekeeper）

            首次打开被拦截时，任选一种方式：

            1. 在 Finder 中右键点按应用 → 选择「打开」→ 再次确认「打开」。
            2. 终端执行：`xattr -dr com.apple.quarantine /Applications/Panopticon.app`
            3. 打开「系统设置 → 隐私与安全性」，在底部点击「仍要打开」。

            ### Windows（SmartScreen）

            运行 `.msi` 或 `-setup.exe` 时若出现「Windows 已保护你的电脑」，
            点击「更多信息」→「仍要运行」。

            ### Linux

            deb/rpm 安装后 `panopticon` 与 `walker-index` 都在 PATH 上。
            首次使用先执行 `walker-index scan --db ~/.local/share/panopticon/index.db /path/to/scan`
            填充索引，再启动 `panopticon`。
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sig
